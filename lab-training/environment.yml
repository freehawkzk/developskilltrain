name: lab-training
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - scipy
  - matplotlib
  - pandas
  - scikit-learn
  - jupyterlab
  - notebook
  - ipywidgets
  - tqdm
  - pytorch>=2.0
  - torchaudio>=2.0
  - cudatoolkit=11.8
  - librosa
  - soundfile
  - sox
  - tensorboard
  - ffmpeg
  - pip
  - pip:
    - pesq
    - pystoi
    - mir-eval
    - openai-whisper
    - deepfilterlib  # 必需: 提供 libdf (Rust 扩展)，module 5 notebook 加载 DeepFilterNet3 预训练权重需要；vendored 源码 (DeepFilterNet-main/DeepFilterNet/df/) 只含 Python 部分，依赖 libdf 才能运行 init_df/enhance
    - wandb
